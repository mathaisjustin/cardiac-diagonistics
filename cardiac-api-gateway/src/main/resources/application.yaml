server:
  port: 9090

spring:
  application:
    name: cardiac-api-gateway

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Swagger UI dropdown aggregating each downstream service's OpenAPI doc, proxied through
# this gateway's own /api-docs/* passthrough routes (see GatewayRoutesConfig.docsRoutes()).
springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /api-docs/auth
      - name: User Profile Service
        url: /api-docs/profile
      - name: Diagnosis Service
        url: /api-docs/diagnosis
      - name: Bookmark Service
        url: /api-docs/bookmark
