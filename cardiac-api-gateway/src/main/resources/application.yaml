server:
  port: 9090

spring:
  application:
    name: cardiac-api-gateway

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Single merged Swagger UI page (no "Select a definition" dropdown) - all 4 downstream
# services' endpoints combined into one document by AggregatedApiDocsController, grouped
# visually by each service's own @Tag. See AggregatedApiDocsController's class Javadoc.
springdoc:
  swagger-ui:
    url: /api-docs/unified
