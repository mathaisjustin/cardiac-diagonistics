spring:
  application:
    name: cardiac-diagnosis-service
  kafka:
    # Deliberately unreachable - tests must never talk to a real Kafka broker (e.g. the one
    # docker-compose runs on the real 9092 for local dev).
    bootstrap-servers: localhost:19999

server:
  port: 0

jwt:
  secret: test-only-secret-never-use-in-production-1234567890

external:
  # Unreachable - fine since no test exercises a real HTTP call to it at context startup.
  diagnosis-api-url: http://localhost:19999

bookmark:
  kafka:
    topic: bookmark.created

eureka:
  client:
    enabled: false
