version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: cardiac-sql-service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cardiac-net

networks:
  cardiac-net:
    name: cardiac-net

volumes:
  mysql_data:
