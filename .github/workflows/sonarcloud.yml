name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Build, test, and analyze
    runs-on: ubuntu-latest
    env:
      SERVICES: cardiac-auth-service user-profile-service cardiac-diagnosis-service bookmark-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The services build and run on Java 17, but the sonar-scanner itself requires
          # Java 21+ to execute - this is only the JVM running the scanner/Maven process,
          # not a change to the services' own compiler/runtime target.
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('*/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # Each service is a standalone Maven project (no root aggregator pom), so build/test
      # them one at a time to produce each one's target/classes and JaCoCo XML report -
      # sonar-scanner (not sonar-maven-plugin, since there's no single reactor build to hang
      # a "sonar:sonar" goal off of) then reads all 4 services' sources/binaries/reports in
      # one pass below, reporting to a single SonarCloud project instead of one per service.
      - name: Build and test each service
        run: |
          for service in $SERVICES; do
            (cd "$service" && mvn -B clean verify)
          done
        shell: bash

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=mathaisjustin
            -Dsonar.projectKey=mathaisjustin_cardiac-diagonistics
            -Dsonar.sources=cardiac-auth-service/src/main,user-profile-service/src/main,cardiac-diagnosis-service/src/main,bookmark-service/src/main
            -Dsonar.tests=cardiac-auth-service/src/test,user-profile-service/src/test,cardiac-diagnosis-service/src/test,bookmark-service/src/test
            -Dsonar.java.binaries=cardiac-auth-service/target/classes,user-profile-service/target/classes,cardiac-diagnosis-service/target/classes,bookmark-service/target/classes
            -Dsonar.java.test.binaries=cardiac-auth-service/target/test-classes,user-profile-service/target/test-classes,cardiac-diagnosis-service/target/test-classes,bookmark-service/target/test-classes
            -Dsonar.java.libraries=**/target/classes,${{ env.HOME }}/.m2/repository/**/*.jar
            -Dsonar.java.test.libraries=**/target/test-classes,${{ env.HOME }}/.m2/repository/**/*.jar
            -Dsonar.coverage.jacoco.xmlReportPaths=cardiac-auth-service/target/site/jacoco/jacoco.xml,user-profile-service/target/site/jacoco/jacoco.xml,cardiac-diagnosis-service/target/site/jacoco/jacoco.xml,bookmark-service/target/site/jacoco/jacoco.xml
