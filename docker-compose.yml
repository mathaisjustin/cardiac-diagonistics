services:
  mysql:
    image: mysql:8.0
    container_name: cardiac-sql-service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cardiac-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: cardiac-kafka-service
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - cardiac-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: cardiac-nosql-service
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cardiac-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: cardiac-redis-service
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "rootpassword"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cardiac-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rootpassword", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./cardiac-auth-service
      dockerfile: Dockerfile
    container_name: cardiac-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_SECRET: ${JWT_SECRET:-dGVzdC1zZWNyZXQtZm9yLWxvY2FsLXRlc3Rpbmctb25seS1uZXZlci11c2UtaW4tcHJvZA==}
    networks:
      - cardiac-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  user-profile-service:
    build:
      context: ./user-profile-service
      dockerfile: Dockerfile
    container_name: cardiac-user-profile-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    networks:
      - cardiac-net
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  bookmark-service:
    build:
      context: ./bookmark-service
      dockerfile: Dockerfile
    container_name: cardiac-bookmark-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_HOST: cardiac-nosql-service
      DB_PORT: 27017
      DB_USER: root
      DB_PASSWORD: rootpassword
      REDIS_HOST: cardiac-redis-service
      REDIS_PORT: 6379
      REDIS_PASSWORD: rootpassword
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    networks:
      - cardiac-net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

networks:
  cardiac-net:
    name: cardiac-net

volumes:
  mysql_data:
  kafka_data:
  mongo_data:
  redis_data:
