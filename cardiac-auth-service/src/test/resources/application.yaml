spring:
  application:
    name: cardiac-auth-service

  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:h2:mem:auth_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

server:
  port: 0

jwt:
  secret: test-only-secret-never-use-in-production-1234567890
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

kafka:
  # Deliberately unreachable - tests must never talk to a real Kafka broker (e.g. the one
  # docker-compose runs on the real 9092 for local dev).
  bootstrap-servers: localhost:19999

eureka:
  client:
    enabled: false
